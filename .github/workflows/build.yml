name: Build and Release

on:
  push:
    branches:
      - master
      - 'agent/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-win7-windows-msvc'
            config: 'src-tauri/tauri.win7.conf.json'
            artifact: 'clipshare-win7-x64'
            win7: true
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            config: 'src-tauri/tauri.modern.conf.json'
            artifact: 'clipshare-windows-x64'
            win7: false
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            config: ''
            artifact: 'clipshare-macos-x64'
            win7: false
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            config: ''
            artifact: 'clipshare-macos-arm64'
            win7: false
          - platform: 'ubuntu-24.04'
            target: 'x86_64-unknown-linux-gnu'
            config: ''
            artifact: 'clipshare-linux-x64'
            win7: false

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          if ('${{ matrix.win7 }}' -eq 'true') {
            rustup toolchain install nightly --profile minimal --component rust-src
          } else {
            rustup target add ${{ matrix.target }}
          }
          cargo install tauri-cli --locked
          npm ci

      - name: Setup (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev
          rustup target add ${{ matrix.target }}
          cargo install tauri-cli --locked
          npm ci

      - name: Setup (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add ${{ matrix.target }}
          cargo install tauri-cli --locked
          npm ci

      - name: Build (Win7)
        if: matrix.win7 == true
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = 'nightly'
          npm run build
          $env:TAURI_CONFIG = Get-Content -Raw src-tauri/tauri.win7.conf.json
          cargo build --manifest-path src-tauri/Cargo.toml --release --target ${{ matrix.target }} --bin clipshare --locked

      - name: Build (Windows)
        if: matrix.platform == 'windows-latest' && matrix.win7 == false
        shell: pwsh
        run: |
          npm run tauri build -- --target ${{ matrix.target }} --config ${{ matrix.config }}

      - name: Build (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 3
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            src-tauri/target/${{ matrix.target }}/release/clipshare*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/clipshare
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
