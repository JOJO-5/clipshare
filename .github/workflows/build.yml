name: Build and Release

on:
  push:
    branches:
      - master
      - 'agent/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            config: 'src-tauri/tauri.win7.conf.json'
            artifact: 'clipshare-win7-x64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            config: 'src-tauri/tauri.modern.conf.json'
            artifact: 'clipshare-windows-x64'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            config: ''
            artifact: 'clipshare-macos-x64'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            config: ''
            artifact: 'clipshare-macos-arm64'
          - platform: 'ubuntu-24.04'
            target: 'x86_64-unknown-linux-gnu'
            config: ''
            artifact: 'clipshare-linux-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          rustup target add ${{ matrix.target }}
          cargo install tauri-cli --locked
          npm ci

      - name: Setup (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev
          rustup target add ${{ matrix.target }}
          cargo install tauri-cli --locked
          npm ci

      - name: Setup (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add ${{ matrix.target }}
          cargo install tauri-cli --locked
          npm ci

      - name: Build
        run: |
          npm run tauri build -- --target ${{ matrix.target }} ${{ matrix.config != '' && format('--config {0}', matrix.config) || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 3
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            src-tauri/target/${{ matrix.target }}/release/clipshare*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/clipshare
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
