[package]
name = "clipshare"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
dirs = "6"
flate2 = "1"
clipboard-win = "5"
arboard = "3"
tauri-plugin-notification = { version = "^2.0.0", features = ["windows7-compat"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }
uiautomation = { version = "=0.23.0", default-features = false, features = ["control", "event", "input", "process"] }
winreg = "0.55"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
win7-compat = []

[patch.crates-io]
webview2-com-sys = { path = "vendor/webview2-com-sys-0.38.2-win7" }
